[project]
name = "logistics-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pillow==13.0.0",
  "itsdangerous==2.2.0",
  "alembic==1.17.0",
  "sqlalchemy==2.0.44",
  "argon2-cffi==25.1.0",
  "fastapi==0.162.0",
  "uvicorn==0.38.0",
  "psycopg[binary]==3.2.10",
  "redis==6.4.0",
  "pydantic-settings==2.11.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.14.1",
  "mypy==1.18.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: disposable real PostgreSQL migration/seed tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["app", "tests", "alembic"]
